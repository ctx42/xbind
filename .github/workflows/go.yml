# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on: [push, pull_request]

# The workflow declares the minimum required permissions.
# This follows the principle of least privilege.
permissions:
  contents: read

# Cancel any in-progress runs for the same branch or PR.
# This is useful since the workflow runs on all branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  C42_CC_RUN_ID: github-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        # The minimum version from go.mod and the newest Go release.
        go-version: ['1.26.x', 'stable']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: true   # Enables module caching for faster runs.

    - name: Test
      run: go test -race ./...

    - name: Differential test
      working-directory: internal/difftest
      run: go test ./...
